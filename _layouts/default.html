<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} · AdShield</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/png" href="{{ '/assets/img/favicon.png' | relative_url }}">
  <style>
    :root { --bg:#07110F; --bg2:#0B1715; --surface:rgba(16,32,29,.72); --border:rgba(255,255,255,.10);
            --text:#F1F7F4; --text2:#A0B5AC; --muted:#667D73; --primary:#36E88D; --teal:#00BFA5; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--text); font:16px/1.65 Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
           background: radial-gradient(900px 600px at 10% -10%, rgba(54,232,141,.16), transparent 60%),
                       radial-gradient(700px 500px at 110% 40%, rgba(0,191,165,.10), transparent 60%), var(--bg); min-height:100vh; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 32px 16px 64px; }
    header { display:flex; align-items:center; gap:12px; margin-bottom:24px; }
    header a { color:var(--text); text-decoration:none; font-weight:700; font-size:20px; }
    nav { margin-left:auto; display:flex; gap:16px; font-size:14px; }
    nav a { color:var(--text2); text-decoration:none; } nav a:hover { color:var(--primary); }
    .card { background:var(--surface); border:1px solid var(--border); border-radius:24px; padding:28px 24px; }
    h1 { font-size:28px; line-height:1.25; margin:0 0 4px; }
    h2 { font-size:19px; margin:32px 0 8px; color:var(--text); }
    h3 { font-size:16px; margin:20px 0 6px; }
    p, li { color:var(--text2); } strong { color:var(--text); }
    a { color:var(--primary); }
    table { width:100%; border-collapse:collapse; margin:12px 0; font-size:14px; }
    th, td { text-align:left; padding:10px 8px; border-bottom:1px solid var(--border); vertical-align:top; }
    th { color:var(--text); } td { color:var(--text2); }
    code { background:rgba(255,255,255,.06); padding:1px 6px; border-radius:6px; font-size:.9em; }
    .meta { color:var(--muted); font-size:14px; margin-bottom:16px; }
    header .brand { display:flex; align-items:center; gap:10px; }
    header .brand img { width:32px; height:32px; border-radius:9px; }
    main.card { animation: rise .6s cubic-bezier(.2,.7,.2,1) both; }
    @keyframes rise { from { opacity:0; transform: translateY(16px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce) { main.card { animation: none; } }
    footer { margin-top:24px; color:var(--muted); font-size:13px; text-align:center; }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <a class="brand" href="{{ '/' | relative_url }}"><img src="{{ '/assets/img/icon-192.png' | relative_url }}" alt="" width="32" height="32">AdShield</a>
      <nav>
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/legal/privacy-policy/' | relative_url }}">Privacy policy</a>
        <a href="{{ '/legal/terms/' | relative_url }}">Terms</a>
      </nav>
    </header>
    <main class="card">
      {{ content }}
    </main>
    <footer>AdShield · <code>com.aps.adshield</code></footer>
  </div>
</body>
</html>
